steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/autoclicker-api:$BUILD_ID
      - .

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/autoclicker-api:$BUILD_ID

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - autoclicker-api
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/autoclicker-api:$BUILD_ID
      - --region=europe-west1
      - --project=$PROJECT_ID
      - --allow-unauthenticated
      - --quiet

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/autoclicker-api:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY