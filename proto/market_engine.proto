syntax = "proto3";

package market_engine.v1;

import "google/protobuf/timestamp.proto";

// Go package import option
option go_package = "github.com/santos/autoclicker/gen/v1;enginev1";

// Java package import option
option java_multiple_files = true;
option java_outer_classname = "MarketEngineProto";

// ENUMS

enum SignalType {
    SIGNAL_TYPE_UNSPECIFIED = 0;
    SIGNAL_TYPE_BUY = 1;
    SIGNAL_TYPE_SELL = 2;
    SIGNAL_TYPE_HOLD = 3;
    SIGNAL_TYPE_CLOSE_POSITION = 4;
}

enum OrderSide {
    ORDER_SIDE_UNSPECIFIED = 0;
    ORDER_SIDE_BUY = 1;
    ORDER_SIDE_SELL = 2;
}

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_SUBMITTED = 1;
  EXECUTION_STATUS_FILLED = 2;
  EXECUTION_STATUS_PARTIALLY_FILLED = 3;
  EXECUTION_STATUS_REJECTED = 4;
  EXECUTION_STATUS_CANCELLED = 5;
}

// MESSAGES

message MarketTick {
    string symbol = 1;
    double price = 2;
    double volume = 3;
    double bid_price = 4;
    double ask_price = 5;
    google.protobuf.Timestamp timestamp = 6;
    uint64 sequence_id = 7;
}

message PredictSignalRequest {
    string model_id = 1;
    MarketTick tick = 2;
    map<string, double> indicators = 3;
}

// ML Prediction result returned from Python to Go
message SignalResponse {
  string signal_id = 1;               // Unique UUID for this signal instance
  string symbol = 2;                  // Target symbol
  SignalType signal_type = 3;         // BUY, SELL, HOLD
  double confidence_score = 4;        // Model probability/confidence (0.0 to 1.0)
  double target_price = 5;            // Suggested take-profit or target price
  double stop_loss_price = 6;         // Suggested stop-loss level
  google.protobuf.Timestamp timestamp = 7;
  map<string, string> metadata = 8;   // Diagnostic info (e.g., model_version, latency_ms)
}

// Order execution event payload (Published to Kafka by Go, consumed by Java)
message OrderExecutionEvent {
  string order_id = 1;
  string symbol = 2;
  OrderSide side = 3;
  double quantity = 4;
  double executed_price = 5;
  ExecutionStatus status = 6;
  string signal_id = 7;               // Tracing back to the Python ML Signal
  google.protobuf.Timestamp executed_at = 8;
  string error_message = 9;           // Populated if status == REJECTED
}

// ============================================================================
// SERVICES (gRPC Interfaces)
// ============================================================================

service SignalPredictorService {
  // 1. Unary Request-Response (Single tick evaluation)
  rpc PredictSignal (PredictSignalRequest) returns (SignalResponse);

  // 2. Client Streaming (Go streams ticks, Python yields a signal when conditions met)
  rpc StreamTicksForSignals (stream MarketTick) returns (SignalResponse);

  // 3. Bi-Directional Streaming (Real-time duplex tick stream and signal pipeline)
  rpc LiveSignalPipeline (stream MarketTick) returns (stream SignalResponse);
}