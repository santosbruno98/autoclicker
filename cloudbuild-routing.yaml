
steps:
  - id: build-routing-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - routing-service/Dockerfile
      - --tag
      - europe-west1-docker.pkg.dev/$PROJECT_ID/routing/guarda-routing:$COMMIT_SHA
      - routing-service

  - id: push-routing-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/routing/guarda-routing:$COMMIT_SHA

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/routing/guarda-routing:$COMMIT_SHA

timeout: 3600s

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
