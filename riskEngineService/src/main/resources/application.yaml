spring:
  application:
    name: riskEngineService

# Database Setup TODO: not sure if i need this db, maybe i should use the mysql db which contains the portfolio data
datasource:
  url: jdbc:postgresql://localhost:5432/risk_engine_db
  username: postgres
  password: postgrespassword
  driver-class-name: org.postgresql.Driver
  hikari:
    maximum-pool-size: 5
    minimum-idle: 5

  # JPA
  jpa:
    hibernate:
      ddl-auto: update # 
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # rabbitmq Setup
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 3
        max-concurrency: 10
